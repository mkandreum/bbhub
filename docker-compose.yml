services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Coolify/Traefik entra por la red interna; no publicamos el puerto en el host.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD es obligatorio}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      WEATHER_CITY: ${WEATHER_CITY:-Madrid}
      NEWS_FEEDS: ${NEWS_FEEDS:-}
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-imap.gmail.com}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-smtp.gmail.com}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-465}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      # Sesión de Telegram, notas, favoritos de radio e historial de Gemini.
      - bbhub_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  bbhub_data:
